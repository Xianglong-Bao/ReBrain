seed_everything: 42
trainer:
  accelerator: auto
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: 32
  logger:
    class_path: pytorch_lightning.loggers.TensorBoardLogger
    init_args:
      save_dir: logs
      name: white_noise
  fast_dev_run: false
  max_epochs: -1
  max_steps: 96000
  limit_val_batches: 0
  num_sanity_val_steps: 0
  log_every_n_steps: 10
  enable_checkpointing: true
  enable_progress_bar: true
  enable_model_summary: true
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/white_noise
        filename: "white_noise-step{step}"
        monitor: null
        mode: min
        save_top_k: -1
        save_last: true
        every_n_train_steps: 10000
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: false
  sync_batchnorm: true
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: checkpoints/white_noise
model:
  class_path: models.rebrain.ReBrain
  init_args:
    lr:
      g: 1e-5
      d: 1e-7
    training_steps: 96000
    warmup: 4000
    accumulate_grad_batches: 1
    use_balancer: true
    train_discriminator: true
    load_model: null
    weights:
      lambda_r: 1.0
      lambda_l: 1.0
      lambda_s: 1.0
      lambda_f: 2.0
      lambda_a: 1.0
      lambda_q: 1.0
    model:
      class_path: models.encodec.Encodec
      init_args:
        encoder:
          class_path: models.encodec.SEANetEncoder
          init_args:
            n_filters: 16
            max_filters: 256
            dimension: 64
            kernel_size: 3
            last_kernel_size: 3
            causal: false
            ratios: [2, 2, 2, 2, 2, 2]
            lstm: 0
            norm: "none"
            true_skip: True
        decoder:
          class_path: models.encodec.SEANetDecoder
          init_args:
            n_filters: 16
            max_filters: 256
            dimension: 64
            kernel_size: 3
            last_kernel_size: 3
            causal: false
            ratios: [2, 2, 2, 2, 2, 2]
            lstm: 0
            norm: "none"
            true_skip: True
        sample_rate: 512
        segment: 4
        overlap: 0
    quantizer:
      class_path: vector_quantize_pytorch.ResidualVQ
      init_args:
        dim: 64
        num_quantizers: 4
        codebook_size: 256
        decay: 0.99
        kmeans_init: true
        kmeans_iters: 800
        rotation_trick: false
        learnable_codebook: false
        use_cosine_sim: false
        channel_last: false
        commitment_weight: 1000
        threshold_ema_dead_code: 2
data:
  class_path: datasets.synthetic_1f.Synthetic1FData
  init_args:
    target_amp_path: /path/to/synthetic_1f_cache/swec_flat_amp.npy
    batch_size: 16
    segment_size: 4000
    stride: 1000
    n_channels: 36
    num_workers: 8
    sample_rate: 512
    length: 100000
    repeat_single: false
